[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statebraid"
version = "0.1.0.dev0"
description = "Agent-aware compute-continuity runtime for long-running local agents"
requires-python = ">=3.11"

[project.scripts]
statebraid-doctor = "statebraid.doctor:main"
statebraid-reference = "statebraid.reference:main"

[tool.setuptools.package-data]
"statebraid.integrations.mlx" = ["*.patch"]

[tool.setuptools.packages.find]
where = ["src"]
